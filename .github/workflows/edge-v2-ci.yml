name: Edge V2 Firmware
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: g++ -std=c++17 -Wall -Wextra -Werror tests/core_test.cpp -o /tmp/edge-test && /tmp/edge-test
      - run: python -m unittest discover -s tests -p 'test_bridge.py'
      - run: pip install platformio==6.1.18
      - run: pio run -e esp32dev
