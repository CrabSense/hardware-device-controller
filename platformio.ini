[platformio]
src_dir = .
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
; 4 MB ESP32 DevKit: two larger OTA slots; preserves NVS offsets.
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
build_src_filter =
    +<*>
    -<tests/>
    -<kiosk/>
lib_deps =
    bblanchon/ArduinoJson@^7.4.0
